---
name: Dependabot patch auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto_merge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Approve and merge Dependabot patches
        uses: egym/egym-actions/auto-merge-dependabot@c9b288b4779a3ffe238f8297cac4586749232eed # v1
        with:
          egym-app-private-key: ${{ secrets.EGYM_APP_PRIVATE_KEY }}
          only-automerge-dependabot-alerts: 'false'
          automerge-minor-updates: 'false'
          automerge-major-updates: 'false'
          use-squash-merge: 'true'
