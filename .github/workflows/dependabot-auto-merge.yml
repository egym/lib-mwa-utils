---
name: Dependabot patch auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto_merge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check app credentials
        env:
          APP_PRIVATE_KEY: ${{ secrets.EGYM_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::EGYM_APP_PRIVATE_KEY must be available as a Dependabot secret."
            exit 1
          fi

      - name: Create repository-scoped app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '427619'
          private-key: ${{ secrets.EGYM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Fetch verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Merge patch updates after required checks
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pr=$(gh pr view "$PR_NUMBER" --json state,isDraft,baseRefName,headRefOid,reviewDecision)
          jq -e --arg head "$PR_HEAD" \
            '.state == "OPEN" and (.isDraft | not) and .baseRefName == "main" and .headRefOid == $head' <<< "$pr"

          if [[ $(jq -r '.reviewDecision' <<< "$pr") != "REVIEW_REQUIRED" ]]; then
            gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD"
          else
            # Deferred auto-merge does not reliably honor ruleset review bypass.
            echo "::notice::Using the app's review-only bypass after required checks; CI and signatures remain enforced."
            gh pr checks "$PR_NUMBER" --required --watch --fail-fast --interval 10
            gh pr checks "$PR_NUMBER" --required --json state |
              jq -e 'length > 0 and all(.[]; .state == "SUCCESS")'
            pr=$(gh pr view "$PR_NUMBER" --json state,isDraft,baseRefName,headRefOid)
            if [[ $(jq -r '.state' <<< "$pr") == "MERGED" ]]; then
              exit 0
            fi
            jq -e --arg head "$PR_HEAD" \
              '.state == "OPEN" and (.isDraft | not) and .baseRefName == "main" and .headRefOid == $head' <<< "$pr"
            gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/merge" \
              -f merge_method=squash -f sha="$PR_HEAD" | jq -e '.merged == true'
          fi
